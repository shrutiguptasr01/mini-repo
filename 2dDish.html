<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Dish</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
     <style>
        body{
            margin:0;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#dfefff;
        }

        .container{
            position:relative;
            width:200px;
            height:250px;
        }

        .pole{
            position:absolute;
            width:10px;
            height:120px;
            background:black;
            left:95px;
            bottom:20px;
        }

        .dish{
            position:absolute;
            width:120px;
            height:120px;
            border:8px solid gray;
            border-radius:50%;
            border-right-color:transparent;
            border-bottom-color:transparent;
            transform:rotate(-45deg);
            left:40px;
            top:20px;
            transition:transform 0.5s;
        }
     </style>
</head>
<body>

<div class="container">
    <div class="pole"></div>
    <div class="dish" id="dish"></div>
</div>

<button onclick="rotateDish()">Rotate Dish</button>

<script>
    let angle = -45;

    function rotateDish(){
        angle += 20;
        document.getElementById("dish").style.transform = `rotate(${angle}deg)`;
    }
</script>

</body>
</html>
